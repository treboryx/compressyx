<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="120" y1="0" x2="900" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#241A47"/>
      <stop offset="0.5" stop-color="#1B1136"/>
      <stop offset="1" stop-color="#120B25"/>
    </linearGradient>

    <radialGradient id="bloom" cx="512" cy="512" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.50"/>
      <stop offset="0.6" stop-color="#6A45E8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6A45E8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="topLight" cx="420" cy="120" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mark" x1="279" y1="252" x2="745" y2="772" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E7DEFF"/>
      <stop offset="1" stop-color="#B69EFF"/>
    </linearGradient>

    <linearGradient id="seam" x1="342" y1="512" x2="682" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE0FF"/>
      <stop offset="0.5" stop-color="#EDFAFF"/>
      <stop offset="1" stop-color="#7FE0FF"/>
    </linearGradient>

    <linearGradient id="rim" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#bloom)"/>
    <rect width="1024" height="1024" fill="url(#topLight)"/>

    <g filter="url(#glow)" opacity="0.55">
      <g fill="none" stroke="#9B7CFF" stroke-width="92" stroke-linecap="round" stroke-linejoin="round">
        <path d="M279 262 L512 432 L745 262"/>
        <path d="M279 762 L512 592 L745 762"/>
      </g>
      <rect x="342" y="499" width="340" height="26" rx="13" fill="#7FE0FF"/>
    </g>

    <g fill="none" stroke="url(#mark)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round">
      <path d="M279 262 L512 432 L745 262"/>
      <path d="M279 762 L512 592 L745 762"/>
    </g>

    <rect x="342" y="499" width="340" height="26" rx="13" fill="url(#seam)"/>
  </g>

  <rect x="3" y="3" width="1018" height="1018" rx="228" ry="228" fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
