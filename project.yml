name: CompressyX
options:
  bundleIdPrefix: com.compressyx
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  DockProgress:
    url: https://github.com/sindresorhus/DockProgress
    from: "5.0.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  SettingsAccess:
    url: https://github.com/orchetect/SettingsAccess
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.0.0"

targets:
  CompressyX:
    type: application
    platform: macOS
    sources:
      - path: Sources/Compressyx
      - path: AppIcon.icon
    dependencies:
      - package: DockProgress
      - package: KeyboardShortcuts
      - package: SettingsAccess
      - package: Sparkle
    info:
      path: Sources/Compressyx/Info.plist
      properties:
        CFBundleDisplayName: CompressyX
        CFBundleName: CompressyX
        CFBundleIdentifier: com.compressyx.app
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "2.0.0"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleIconName: AppIcon
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        SUFeedURL: "https://raw.githubusercontent.com/treboryx/compressyx/main/appcast.xml"
        SUPublicEDKey: "cQfYfdvb6sjUuLXlJcbuPi8DPB+03gbEsRUXZsDzUaI="
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.compressyx.app
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2.0.0"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_NAME: CompressyX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: CompressyX
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
        ENABLE_APP_SANDBOX: false
